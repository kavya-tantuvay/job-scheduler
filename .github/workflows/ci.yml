name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test (unit + Testcontainers integration)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # Unit tests, then integration tests against PostgreSQL and Redis containers started by
      # Testcontainers (Docker is available on GitHub-hosted runners).
      - name: ./mvnw verify
        run: |
          set -o pipefail
          ./mvnw -B verify 2>&1 | tee build.log

      - name: Report build errors as annotations
        if: failure()
        run: |
          grep -E '\[ERROR\]|FAILURE!|Tests run:.*(Failures: [1-9]|Errors: [1-9])' build.log \
            | head -40 | sed 's/^/::error::/' || true

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            target/surefire-reports/
            target/failsafe-reports/

  docker:
    name: Docker image and compose smoke test
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v5

      - name: Start the full stack (postgres, redis, app)
        run: docker compose up -d --build

      - name: Wait for the application to be healthy
        run: |
          for i in $(seq 1 60); do
            if curl -fs http://localhost:8080/actuator/health | grep -q '"status":"UP"'; then
              curl -s http://localhost:8080/actuator/health; echo; exit 0
            fi
            sleep 3
          done
          echo "Application did not become healthy"; exit 1

      - name: Submit a job and wait for it to succeed
        run: |
          id=$(curl -fs -H 'Content-Type: application/json' -H 'Idempotency-Key: ci-smoke-1' \
                 -d '{"type":"sleep","payload":{"durationMs":200}}' http://localhost:8080/api/jobs | jq -r .id)
          echo "Submitted job $id"
          for i in $(seq 1 30); do
            status=$(curl -fs http://localhost:8080/api/jobs/$id | jq -r .status)
            echo "status: $status"
            [ "$status" = "SUCCEEDED" ] && exit 0
            sleep 1
          done
          exit 1

      - name: Replaying the Idempotency-Key returns the same job
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -H 'Content-Type: application/json' -H 'Idempotency-Key: ci-smoke-1' \
                   -d '{"type":"sleep","payload":{"durationMs":200}}' http://localhost:8080/api/jobs)
          test "$code" = "200"

      - name: Graceful shutdown drains the worker pool
        run: |
          docker compose stop app
          docker compose logs app | grep -E "Job poller stopped|Worker pool drained"

      - name: Show logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v
