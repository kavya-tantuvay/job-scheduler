# `docker compose up --build` runs the whole stack: PostgreSQL, Redis and the application.
# For local development run just the dependencies (`docker compose up postgres redis`) and start
# the app with ./mvnw spring-boot:run.
services:
  postgres:
    image: postgres:16-alpine
    container_name: job-scheduler-postgres
    environment:
      POSTGRES_DB: jobscheduler
      POSTGRES_USER: jobscheduler
      POSTGRES_PASSWORD: jobscheduler
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobscheduler -d jobscheduler"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Used for cluster-wide per-type rate limiting (jobs.rate-limit.enabled=true).
  redis:
    image: redis:7-alpine
    container_name: job-scheduler-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    container_name: job-scheduler-app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/jobscheduler
      DB_USERNAME: jobscheduler
      DB_PASSWORD: jobscheduler
      REDIS_HOST: redis
      RATE_LIMIT_ENABLED: "true"
    ports:
      - "8080:8080"
    # Longer than jobs.worker.drain-timeout (30s) so in-flight jobs can finish on `docker compose stop`.
    stop_grace_period: 40s

volumes:
  postgres-data:
