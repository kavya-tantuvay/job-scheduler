spring:
  application:
    name: job-scheduler

  # Defaults match docker-compose.yml; override with env vars in other environments.
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/jobscheduler}
    username: ${DB_USERNAME:jobscheduler}
    password: ${DB_PASSWORD:jobscheduler}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}

  jpa:
    # Flyway owns the schema; Hibernate only checks that entities match it.
    hibernate:
      ddl-auto: validate
    # Don't hold a DB connection for the whole HTTP request.
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  data:
    web:
      pageable:
        max-page-size: 100
    # Only used when jobs.rate-limit.enabled=true.
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s
      # Redis is used through a Lua script only; no Spring Data Redis repositories to scan for.
      repositories:
        enabled: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  # Thread pool behind @Scheduled: one thread per background loop (poller, reaper, recurring
  # scheduler, metrics refresher). The default single thread would let the poller, which keeps
  # its thread while draining a backlog, delay all the others.
  task:
    scheduling:
      pool:
        size: 4
      thread-name-prefix: scheduler-

server:
  port: ${SERVER_PORT:8080}
  # Finish in-flight HTTP requests on shutdown instead of dropping them.
  shutdown: graceful

management:
  health:
    # Report Redis in /actuator/health only when the app actually depends on it.
    redis:
      enabled: ${RATE_LIMIT_ENABLED:false}
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

springdoc:
  swagger-ui:
    path: /swagger-ui.html

jobs:
  submission:
    default-max-attempts: 3
  worker:
    pool-size: ${WORKER_POOL_SIZE:8}
    queue-capacity: ${WORKER_QUEUE_CAPACITY:8}
    instance-id: ${INSTANCE_ID:}
    drain-timeout: ${WORKER_DRAIN_TIMEOUT:30s}
  poller:
    interval: 1s
    batch-size: 10
  retry:
    base-delay: 2s
    max-delay: 5m
  reaper:
    lease-timeout: 5m
    interval: 30s
    batch-size: 100
  recurring:
    interval: 1s
    zone: UTC
    misfire-policy: FIRE_ONCE
    misfire-threshold: 1m
    batch-size: 100
  metrics:
    refresh-interval: 10s
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:false}
    per-second:
      webhook: 5
