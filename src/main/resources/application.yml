spring:
  application:
    name: job-scheduler

  # Defaults match docker-compose.yml; override with env vars in other environments.
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/jobscheduler}
    username: ${DB_USERNAME:jobscheduler}
    password: ${DB_PASSWORD:jobscheduler}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}

  jpa:
    # Flyway owns the schema; Hibernate only checks that entities match it.
    hibernate:
      ddl-auto: validate
    # Don't hold a DB connection for the whole HTTP request.
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  data:
    web:
      pageable:
        max-page-size: 100

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

springdoc:
  swagger-ui:
    path: /swagger-ui.html

jobs:
  submission:
    default-max-attempts: 3
